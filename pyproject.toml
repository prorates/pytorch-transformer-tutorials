# Project metadata + tooling config (ruff, mypy, pytest).
#
# The dependency set below is the DIRECT imports of the tutorial modules, pinned
# to the versions this repo is known to run under. uv.lock pins the transitive
# closure; cuda-requirements.txt / mps-requirements.txt stay as the per-accelerator
# freeze for a hand-built venv and are not what CI resolves.
#
# torchtext is deliberately absent: dataset7 replaced its EOL WikiText2 with
# HuggingFace `datasets`, and only the comments still name it.

[project]
name = "pytorch-transformer-tutorials"
version = "0.1.0"
description = "Annotated PyTorch transformer implementations, from the paper up."
# torch 2.5.1 publishes no cp313 wheels, so 3.12 is both floor and ceiling.
requires-python = ">=3.12,<3.13"
# torch is NOT here — it lives in the `cpu` / `cu124` groups below, because the
# wheel to install depends on the accelerator, not on the platform alone.
dependencies = [
    "datasets==3.2.0",
    "tokenizers==0.21.0",
    "torchmetrics==1.6.1",
    "tensorboard==2.18.0",
    "numpy==2.2.2",
    "PyYAML==6.0.2",
    "tqdm==4.67.1",
]

[dependency-groups]
dev = [
    "ruff==0.16.3",   # keep in step with .pre-commit-config.yaml
    "mypy==1.14.1",
    "pytest==8.3.4",
]
# Accelerator groups — exactly one is ever installed. `cpu` is a default group, so
# a bare `uv sync` / `uv run` does the right thing on Apple Silicon (the CPU index
# serves the same macOS arm64 wheel as PyPI, MPS included) and on a CPU-only linux
# box. An NVIDIA machine opts out and in:
#
#     uv sync --no-group cpu --group cu124
#
# This replaces cuda-requirements.txt / mps-requirements.txt, whose torch pins had
# drifted apart (2.3.1 vs 2.5.1). Both groups now name one version.
cpu = ["torch==2.5.1"]
cu124 = ["torch==2.5.1"]

# Nothing here is importable as an installed distribution — the tutorial modules
# sit at the repo root and are imported by path. Without this uv tries to build a
# wheel from a project with no package layout and fails.
[tool.uv]
package = false
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "cu124" }]]

# PyPI's linux `torch` wheel drags in ~2.5 GB of nvidia-cu12 packages, which a CI
# runner and a CPU-only box never use; the CPU index serves the same version as a
# ~180 MB wheel and carries the macOS arm64 wheel unchanged. The CUDA index is
# linux-only — it publishes no darwin wheels, so without the marker the lock has
# no resolution for macOS + cu124.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu124", group = "cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 159
target-version = "py312"
# model5.py is a near-verbatim vendored copy of torch's nn.Transformer; keep it
# close to upstream rather than reformatting/relinting it. custom_datasets holds
# one-off data-prep scripts and notebooks are out of scope for the lint baseline.
#
# .claude/ and bin/ hold Python delivered by claude-meta (propagation class M).
# It is not ours to restyle: reformatting it desyncs the files from meta's copy,
# so every later broadcast lands as a 3-way conflict on pure formatting. It is
# linted upstream against meta's own config, not this repo's line-length.
extend-exclude = ["model5.py", "custom_datasets", "*.ipynb", ".claude", "bin"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
# Pragmatic relaxations for torch-heavy code: torch ops are typed to return Any
# in many places, so requiring non-Any returns / fully-typed torch calls is noise
# rather than signal. We still require our own functions to be annotated.
warn_return_any = false
disallow_untyped_calls = false
# model5.py is vendored torch source; custom_datasets holds one-off prep scripts.
# bin/ and .claude/ are claude-meta's delivered Python (propagation class M),
# checked upstream against meta's own config — see the ruff note above.
exclude = ['model5\.py', 'custom_datasets/', '^bin/', '^\.claude/']

# Third-party libs without (complete) type stubs.
[[tool.mypy.overrides]]
module = [
    "torchmetrics.*",
    "datasets.*",
    "tokenizers.*",
    "torchtext.*",
    "tqdm.*",
    "yaml",
]
ignore_missing_imports = true

# Vendored torch copy — ignore entirely.
[[tool.mypy.overrides]]
module = ["model5"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
